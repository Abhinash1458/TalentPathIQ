name: talentpathiq

services:
  db:
    image: postgres:17-alpine
    container_name: tpiq-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-talentpath_iq}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Published on 5434 so it cannot collide with other local Postgres
      # instances already using 5432/5433.
      - "${DB_PORT:-5434}:5432"
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-talentpath_iq}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      # Repo root, so the image builds identically here and on Railway.
      context: .
      dockerfile: backend/Dockerfile
    container_name: tpiq-backend
    restart: unless-stopped
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-talentpath_iq}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-True}
      # "backend" and "web" are needed for in-network requests and the
      # nginx proxy; localhost/127.0.0.1 cover direct host access.
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,backend,web,0.0.0.0
      CORS_ALLOWED_ORIGINS: http://localhost:${WEB_PORT:-3000},http://127.0.0.1:${WEB_PORT:-3000},http://localhost:5173
      DJANGO_SUPERUSER_USERNAME: ${DJANGO_SUPERUSER_USERNAME:-admin}
      DJANGO_SUPERUSER_PASSWORD: ${DJANGO_SUPERUSER_PASSWORD:-admin}
      DJANGO_SUPERUSER_EMAIL: ${DJANGO_SUPERUSER_EMAIL:-admin@example.com}
    ports:
      - "${BACKEND_PORT:-8002}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/api/courses/ > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  web:
    build:
      context: .
    container_name: tpiq-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_started

volumes:
  pgdata:
